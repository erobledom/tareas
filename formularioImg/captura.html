<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Jugador</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #fff;
            font-family: "Courier New", monospace;
        }

        .contenedor {
            max-width: 730px;
            margin: 35px auto;
            padding: 25px 55px 42px;
            background: #a1a1ba;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin: 0 0 24px;
        }

        form {
            background: #fff;
            padding: 22px;
            border-radius: 12px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo > label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
        }

        fieldset {
            margin: 17px 0 20px;
            padding: 12px 16px;
            border: 1px solid #e1e1e8;
        }

        legend {
            padding: 0 5px;
        }

        fieldset label {
            display: block;
            margin: 5px 0;
            font-weight: bold;
        }

        input[type="checkbox"],
        input[type="radio"] {
            accent-color: orangered;
            margin-right: 8px;
        }

        button {
            background: #007bff;
            color: white;
            border: 0;
            border-radius: 5px;
            padding: 12px 17px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            margin-right: 7px;
        }

        button:hover {
            background: #0061c9;
        }

        @media (max-width: 600px) {
            .contenedor {
                margin: 0;
                padding: 24px 12px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>Formulario de Jugador</h1>

        <form action="index.php" method="POST" enctype="multipart/form-data" onsubmit="return validarImagen()">

            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="campo">
                <label for="alias">Alias:</label>
                <input type="text" id="alias" name="alias" required>
            </div>

            <div class="campo">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="1" required>
            </div>

            <fieldset>
                <legend>Armas a elegir (puedes elegir varias):</legend>

                <label><input type="checkbox" name="armas[]" value="Maza"> Maza</label>
                <label><input type="checkbox" name="armas[]" value="Antorcha"> Antorcha</label>
                <label><input type="checkbox" name="armas[]" value="Martillo"> Martillo</label>
                <label><input type="checkbox" name="armas[]" value="Látigo"> Látigo</label>
            </fieldset>

            <fieldset>
                <legend>¿Practica artes mágicas?</legend>

                <label><input type="radio" name="magia" value="Sí" required> Sí</label>
                <label><input type="radio" name="magia" value="No"> No</label>
            </fieldset>

            <div class="campo">
                <label for="imagen">Subir imagen:</label>
                <input type="file" id="imagen" name="imagen" accept=".png,image/png">
            </div>

            <button type="submit">Enviar</button>
            <button type="reset">Borrar</button>

        </form>
    </div>

    <script>
        function validarImagen() {
            const archivo = document.getElementById('imagen').files[0];

            if (archivo) {
                const nombreValido = archivo.name.toLowerCase().endsWith('.png');
                const tipoValido   = archivo.type === 'image/png';

                if (!nombreValido || !tipoValido) {
                    alert('Solo se permiten imágenes de tipo PNG.');
                    return false;
                }

                if (archivo.size > 10240) {
                    alert('La imagen no puede superar los 10 KB.');
                    return false;
                }
            }

            return true;
        }
    </script>

</body>
</html>
